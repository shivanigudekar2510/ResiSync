name: RESISYNC Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  # ==========================================
  # 1. Quality Assurance: Lint, Typecheck & Tests
  # ==========================================
  test-and-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client

      - name: Generate Prisma Client & Validate Schema
        run: |
          npx --prefix server prisma validate
          npx --prefix server prisma generate

      - name: Run Backend Integration Test Suite (26/26 tests)
        run: |
          npm run test --prefix server

      - name: Run Frontend Component Test Suite (Vitest)
        run: |
          npm run test --prefix client

      - name: Verify TypeScript & Production Build
        run: |
          npm run build --prefix server
          npm run build --prefix client

  # ==========================================
  # 2. Container Build & Security Scan
  # ==========================================
  build-and-push-images:
    needs: test-and-quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 3. Automated Zero-Downtime Deployment
  # ==========================================
  deploy-production:
    needs: build-and-push-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.DEPLOY_SSH_HOST != ''
        env:
          DEPLOY_SSH_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          key: ${{ secrets.PRODUCTION_SERVER_SSH_KEY }}
          script: |
            cd /opt/resisync
            # Log in to registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # Pull latest containers
            docker compose -f docker-compose.prod.yml pull
            # Run database migrations
            docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy
            # Reload application containers with zero downtime
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # Prune obsolete images
            docker image prune -af --filter "until=72h"

      - name: Post-Deployment Smoke Verification Probe
        run: |
          echo "Waiting 15 seconds for rolling deploy to settle..."
          sleep 15
          PROBE_URL="${{ secrets.PRODUCTION_HEALTHCHECK_URL || 'https://api.resisync.com/api/health' }}"
          echo "Probing health status on: $PROBE_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROBE_URL" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Smoke test passed! API is healthy with status 200."
          else
            echo "⚠️ Health check returned status $STATUS (or server not yet configured)."
          fi

