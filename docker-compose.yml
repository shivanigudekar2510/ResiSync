version: '3.8'

services:
  # ==========================================
  # 1. Managed PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: resisync-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resisync_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resisync_secure_pwd_2026}
      POSTGRES_DB: ${POSTGRES_DB:-resisync_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - resisync-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resisync_user} -d ${POSTGRES_DB:-resisync_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  # ==========================================
  # 2. Redis Distributed Cache & Socket.IO State
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: resisync-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-resisync_redis_pass}"]
    volumes:
      - redis_data:/data
    networks:
      - resisync-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-resisync_redis_pass}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ==========================================
  # 3. Node.js Express & Prisma Backend API
  # ==========================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: resisync-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-resisync_user}:${POSTGRES_PASSWORD:-resisync_secure_pwd_2026}@postgres:5432/${POSTGRES_DB:-resisync_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-resisync_production_jwt_secret_token_key_992182}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://resisync.com,http://localhost}
      REDIS_URL: redis://:${REDIS_PASSWORD:-resisync_redis_pass}@redis:6379
      ENABLE_IOT_SIMULATION: "true"
      SANDBOX_PAYMENTS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resisync-internal
      - resisync-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ==========================================
  # 4. React 18 SPA Frontend (Nginx Alpine)
  # ==========================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: resisync-frontend
    restart: unless-stopped
    networks:
      - resisync-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ==========================================
  # 5. Reverse Proxy & SSL Edge Gateway
  # ==========================================
  gateway:
    image: nginx:1.25-alpine
    container_name: resisync-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - resisync-internal
      - resisync-public

volumes:
  postgres_data:
    name: resisync_postgres_data
  redis_data:
    name: resisync_redis_data
  certbot_conf:
    name: resisync_certbot_conf
  certbot_www:
    name: resisync_certbot_www

networks:
  resisync-internal:
    internal: true
  resisync-public:
    driver: bridge

